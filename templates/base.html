<!DOCTYPE html>
<html lang="{{HTMLLANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="alternate" hreflang="en" href="{{HREF_EN}}">
<link rel="alternate" hreflang="pt-BR" href="{{HREF_PT}}">
<link rel="alternate" hreflang="x-default" href="{{HREF_EN}}">
<meta property="og:site_name" content="Smart2Raw">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="{{OGLOCALE}}">
<meta property="og:image" content="{{SITEURL}}/assets/{{OGIMG}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{T_OGALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{SITEURL}}/assets/{{OGIMG}}">
<meta name="theme-color" content="#0d1117">
<link rel="stylesheet" href="{{ROOT}}assets/site.css?v={{CSSV}}">
<link rel="icon" href="{{ROOT}}assets/favicon.svg" type="image/svg+xml">
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>

<a class="skip" href="#main">{{T_SKIP}}</a>

<header class="top">
  <div class="topbar">
    <a class="brand" href="{{HOME}}">Smart<span>2</span>Raw</a>
    <nav class="nav" aria-label="{{T_NAVLABEL}}">
      {{NAV}}
      <span class="navgap"></span>
      <div class="langs">
        <a href="{{HREF_EN}}" class="{{EN_ACTIVE}}" hreflang="en">EN</a>
        <a href="{{HREF_PT}}" class="{{PT_ACTIVE}}" hreflang="pt-BR">PT</a>
      </div>
      <a class="navcta" href="{{CONTACTURL}}">{{T_CONTACT}}</a>
    </nav>
    <span class="navgap"></span>
    <div class="langs" id="mlangs" hidden>
      <a href="{{HREF_EN}}" class="{{EN_ACTIVE}}" hreflang="en">EN</a>
      <a href="{{HREF_PT}}" class="{{PT_ACTIVE}}" hreflang="pt-BR">PT</a>
    </div>
    <button class="burger" id="burger" aria-expanded="false" aria-controls="sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>{{T_MENU}}</span>
    </button>
  </div>
  <div class="sheet" id="sheet">
    {{SHEET}}
    <div class="sep"></div>
    <a class="btn" href="{{CONTACTURL}}">{{T_CONTACT}}</a>
  </div>
</header>

<main id="main">
{{BODY}}
</main>

<footer class="foot">
  <div class="fgrid">
    <div>
      <b>Smart2Raw</b><br>
      {{T_FOOT_TAG}}
    </div>
    <div>
      <a href="https://github.com/carlostbastos/Smart2Raw">GitHub</a><br>
      <a href="https://doi.org/10.5281/zenodo.21623772">DOI 10.5281/zenodo.21623772</a><br>
      <a href="https://doi.org/10.5281/zenodo.20477234">{{T_FOOT_CONCEPT}}</a>
    </div>
    <div>
      {{FOOTLINKS}}
    </div>
  </div>
  <div class="fbot">
    Copyright © 2026 Carlos Alberto Terêncio de Bastos ·
    AGPL-3.0-or-later {{T_OR_COMMERCIAL}}
  </div>
</footer>

<script>
(function(){
  var b=document.getElementById('burger'), s=document.getElementById('sheet'),
      ml=document.getElementById('mlangs');
  function mobile(){ return window.matchMedia('(max-width:960px)').matches }
  function sync(){ ml.hidden = !mobile(); if(!mobile()) close(); }
  function close(){ s.classList.remove('open'); b.setAttribute('aria-expanded','false') }
  b.addEventListener('click', function(){
    var open = s.classList.toggle('open');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){
      if(s.classList.contains('open')){ close(); b.focus(); }
      var d=document.querySelector('.nav details[open]'); if(d) d.removeAttribute('open');
    }
  });
  document.addEventListener('click', function(e){
    document.querySelectorAll('.nav details[open]').forEach(function(d){
      if(!d.contains(e.target)) d.removeAttribute('open');
    });
  });
  window.addEventListener('resize', sync); sync();
})();
</script>
{{EXTRA_JS}}
</body>
</html>
